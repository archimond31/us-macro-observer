<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app">

  <aside class="sidebar">

      <h1 class="logo">US Macro</h1>
      <p class="logo-sub">观察平台</p>
    </div>
    <nav class="nav">
      <a class="nav-item active" data-section="assets">

        <span class="nav-label">大类资产</span>
      </a>
      <a class="nav-item" data-section="rates">
        <span class="nav-icon">📈</span>
        <span class="nav-label">利率</span>
      </a>
      <a class="nav-item" data-section="fed">

        <span class="nav-label">美联储</span>
      </a>
      <a class="nav-item" data-section="liquidity">
        <span class="nav-icon">💧</span>
        <span class="nav-label">流动性</span>
      </a>
      <a class="nav-item" data-section="economy">
        <span class="nav-icon">📊</span>
        <span class="nav-label">经济数据</span>
      </a>
      <a class="nav-item" data-section="credit">
        <span class="nav-icon">💳</span>
        <span class="nav-label">信用市场</span>
      </a>
      <a class="nav-item" data-section="volatility">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">波动率</span>
      </a>
      <a class="nav-item" data-section="crypto">
        <span class="nav-icon">🔗</span>
        <span class="nav-label">加密货币</span>
      </a>
      <a class="nav-item" data-section="ai">

      <a class="nav-item" data-section="signal">
        <span class="nav-icon">🧭</span>
        <span class="nav-label">矛盾信号</span>
      </a>

      <a class="nav-item" data-section="risk">
        <span class="nav-icon">🎯</span>
        <span class="nav-label">风险总览</span>
      </a>
    </nav>

      <p class="data-source-label">数据源</p>
      <p class="data-source-val" id="dataSourceText">FRED / Yahoo Finance</p>
      <p class="data-source-label">数据截至</p>
      <p class="data-source-val" id="dataAsOf">--</p>
      <p class="data-source-label">更新时间</p>
      <p class="data-source-val" id="lastUpdated">--</p>

    <header class="topbar">
      <div>
        <h2 class="page-title" id="sectionTitle">大类资产</h2>
        <p class="page-subtitle" id="sectionSubtitle">Multi-Asset Dashboard</p>

      <div class="topbar-right">
        <div class="status-badge" id="marketStatus">
          <span class="status-dot"></span>
          <span class="status-text">市场开盘中</span>
        </div>
      </div>

    <!-- Section containers -->
    <div class="content" id="content">

# ============================================================
# 每日数据自动更新 workflow
# 每天 UTC 00:00 (北京 08:00 / 美东 19:00 冬令时·20:00 夏令时) 运行:
#   美股收盘 + FRED 日度数据发布完成后拉取, 保证数据完整
# 流水线: build_data.py (取数) → gen_datajs.py (生成 data.js)
#         → render_smoke.cjs (无头渲染冒烟测试, 失败则中止)
# 配合 GitHub Pages 即实现公网每日自动更新
# ============================================================
name: Daily Macro Data Update

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京 08:00
  workflow_dispatch:      # 允许手动触发
  push:
    paths:                # 仅源码/配置变更触发重算, 避免 bot 提交 data.js 时自循环
      - 'scripts/**'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-data:
    # 防止自循环: bot 自身提交会命中 on.push.paths(scripts/*), 进而重复触发本 workflow 并与自身推送竞争
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch real data (FRED / Treasury / NY Fed / Yahoo / BEA)
        run: python build_data.py
        working-directory: scripts
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      - name: Generate data.js
        run: python gen_datajs.py
        working-directory: scripts

      - name: Render smoke test (9 sections, fail fast)
        run: node scripts/render_smoke.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            # checkout@v4 在 push 事件下检出的是「触发那一次的 SHA」(游离 HEAD)。
            # 取数+渲染耗时数分钟, 期间远端 main 常被其他推送(本地 push / 上一轮 bot)推进,
            # 裸 git push 会 ! [rejected] (fetch first)。故先变基到远端最新再推, 失败重试。
            for i in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "变基冲突, 放弃本地提交改为重跑基线"
                git rebase --abort
                git reset --hard origin/main
                exit 1
              fi
              if git push origin HEAD:refs/heads/main; then
                echo "push 成功 (第 $i 次尝试)"
                exit 0
              fi
              echo "push 被拒(远端已前进), 重试 $i/5"
              sleep $((i * 5))
            done
            echo "::error::push 重试 5 次仍失败"
            exit 1
          fi
